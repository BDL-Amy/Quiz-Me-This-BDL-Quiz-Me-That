<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amy.TEST Recovery</title><style>body{font-family:Arial,sans-serif;background:#eee;padding:20px}main{max-width:620px;margin:auto;background:#fff;padding:24px;border-radius:18px}button{width:100%;padding:15px;font-size:16px;border:2px solid #111;border-radius:12px;background:#fff}#code{font-size:24px;font-weight:bold;letter-spacing:1px;word-break:break-all;padding:20px;background:#f3f3f3;border-radius:12px;text-align:center;margin-top:16px}</style></head><body><main><h1>Amy.TEST Recovery</h1><p>This temporary page generates a new recovery code for Amy.TEST. The previous code becomes invalid.</p><button id="go">GENERATE NEW RECOVERY CODE</button><div id="code">Not generated yet.</div><script>const url='https://ggmcjycwrnpahauhwyrs.supabase.co/functions/v1/quiz-service';document.getElementById('go').onclick=async()=>{const box=document.getElementById('code');box.textContent='Generating...';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'rotate_recovery_code',player_id:'a06f21c0-62a7-4072-bad8-e12f6d846e99',player_name:'Amy.TEST'})});const d=await r.json();if(!r.ok||!d.recovery_code)throw new Error(d.error||'Failed');box.textContent=d.recovery_code;document.getElementById('go').disabled=true;}catch(e){box.textContent='Error: '+e.message;}};</script></main></body></html>
