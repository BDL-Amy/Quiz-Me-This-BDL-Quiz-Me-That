name: Patch test platform script
on:
  push:
    paths:
      - 'test-platform.js'
      - '.github/workflows/patch-test-platform.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add test-platform.js to index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="test-platform.js"></script>'
          if tag not in s:
              anchor='<script src="history.js"></script>'
              if anchor not in s:
                  raise SystemExit('history.js anchor not found')
              s=s.replace(anchor, anchor+'\n'+tag)
              p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Load Amy.TEST control platform"
          git push
