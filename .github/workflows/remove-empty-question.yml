name: Remove empty quiz question

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-empty-question.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove empty question object
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''
{
},

{
  question:
    "Bubu found a big bag with a lot of money once. What did she do with it?",'''
          new = '''
{
  question:
    "Bubu found a big bag with a lot of money once. What did she do with it?",'''
          if old not in s:
              raise SystemExit('Expected empty question before Bubu question not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove empty question before Question 49"
          git push origin main
