name: Remove empty quiz question

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove empty question object
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''
{
},

{
  question:
    "Bubu found a big bag with a lot of money once. What did she do with it?",'''
          new = '''
{
  question:
    "Bubu found a big bag with a lot of money once. What did she do with it?",'''
          if old not in s:
              print('Empty question already removed')
          else:
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove empty question before Question 49"
          git push origin main
