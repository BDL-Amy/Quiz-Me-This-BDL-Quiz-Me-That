name: One-shot cleanup backup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backup-before-stats-cleanup-2026-09-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Clean branch in place
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          replacements=[
          ('''    const winner = data?.winner?.player_name ? data.winner : {player_name:"Nunya",week_start:"2026-09-14",week_end:"2026-09-19"};\n    const period = winner.week_start || "2026-09-14";\n    if(shouldOfferWinnerAnnouncement("weekly",period)){\n      announcements.push({type:"weekly",period,winner});\n    }''','''    const winner = data?.winner?.player_name ? data.winner : null;\n    if(winner){\n      const period = winner.week_start;\n      if(period && shouldOfferWinnerAnnouncement("weekly",period)){\n        announcements.push({type:"weekly",period,winner});\n      }\n    }'''),
          ('''  }catch(error){\n    console.error("Weekly winner announcement could not be loaded.",error);\n    const winner={player_name:"Nunya",week_start:"2026-09-14",week_end:"2026-09-19"};\n    if(shouldOfferWinnerAnnouncement("weekly",winner.week_start)){\n      announcements.push({type:"weekly",period:winner.week_start,winner});\n    }\n  }''','''  }catch(error){\n    console.error("Weekly winner announcement could not be loaded.",error);\n  }'''),
          ('''    /* The current official title is public information. Use the already\n       published winner for the current period as a resilient UI fallback. */\n    renderWeeklyHolder({player_name:"Nunya",week_start:"2026-09-14",week_end:"2026-09-19"});''','''    renderWeeklyHolder(null);''')]
          for old,new in replacements:
            assert old in s, 'expected index cleanup target missing'
            s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('history.js'); s=p.read_text()
          old='''loadDashboard=async function(){\n  if(dashboardCache)return dashboardCache;\n  const data=await api(RESULTS_SERVICE,{action:"dashboard",player_id:playerId(),player_name:playerName(),week_start:currentWeekStart(),month_start:currentMonthStart()});\n  dashboardCache=data;\n  return dashboardCache;\n};\n'''
          assert old in s, 'duplicate dashboard target missing'
          p.write_text(s.replace(old,'',1))
          PY
      - name: Verify cleanup and publication safeguards
        run: |
          ! grep -q 'player_name:"Nunya"' index.html
          test "$(grep -R --include='*.js' --include='*.html' -h -E '^(async function loadDashboard|loadDashboard=async function)' . | wc -l)" -eq 1
          grep -q 'showPreviousAnswer' quiz-schedule-1530.js
          node tests/smartest-test-account-ci.js
      - name: Commit cleaned backup branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html history.js
          git commit -m 'Clean statistics paths and stale fallbacks'
          git push origin HEAD:backup-before-stats-cleanup-2026-09-25
