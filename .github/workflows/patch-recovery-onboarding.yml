name: Load recovery onboarding

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load recovery onboarding script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="recovery-onboarding.js"></script>'
          if tag not in text:
              anchor='<script src="account.js"></script>'
              if anchor not in text:
                  raise SystemExit('account.js script tag not found')
              text=text.replace(anchor, anchor+'\n'+tag, 1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load existing-player recovery onboarding"
          git push
