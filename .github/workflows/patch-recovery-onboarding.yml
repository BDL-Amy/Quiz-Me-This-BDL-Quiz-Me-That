name: Repair Question 49

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair slot
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = '''{
},

{
  question:
    "Bubu found a big bag with a lot of money once. What did she do with it?",'''
          replacement = '''{
  question:
    "Bubu found a big bag with a lot of money once. What did she do with it?",'''
          if marker not in s:
              raise SystemExit("Question 49 marker not found")
          p.write_text(s.replace(marker, replacement, 1), encoding="utf-8")
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Question 49"
          git push
