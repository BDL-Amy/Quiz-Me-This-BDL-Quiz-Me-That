name: Enable Catch Up live

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-live-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Catch Up scripts in live page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="account.js?v=20260909c"></script>'
          catch='<script src="result-catchphrases.js?v=20260917a"></script>\n'
          if 'result-catchphrases.js?v=20260917a' not in s:
              if marker not in s:
                  raise SystemExit('index insertion marker not found')
              s=s.replace(marker, catch+marker, 1)
          s=s.replace('quiz-schedule-1530.js?v=20260916-live2','quiz-schedule-1530.js?v=20260917a')
          s=s.replace('quiz-schedule-1530.js?v=20260916-live3','quiz-schedule-1530.js?v=20260917a')
          s=s.replace('test-platform.js?v=20260916-live2','test-platform.js?v=20260917a')
          s=s.replace('test-platform.js?v=20260916-live3','test-platform.js?v=20260917a')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit live index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Load rotating result catchphrases live"
          git push
