name: Sync statistics and policy
on:
  push:
    paths:
      - '.github/workflows/add-title-ranking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix test statistics admin view
        run: python scripts/fix_test_statistics_admin_view.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery-onboarding.js
          git diff --cached --quiet || git commit -m "Fix test statistics admin view"
          git push
