name: Sync test statistics view
on:
  push:
    paths:
      - '.github/workflows/add-title-ranking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch statistics
        run: python scripts/patch_test_stats.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recovery-onboarding.js
          git diff --cached --quiet || git commit -m "Match test statistics to player layout"
          git push
