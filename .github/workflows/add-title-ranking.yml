name: Sync statistics and policy
on:
  push:
    paths:
      - '.github/workflows/add-title-ranking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch policy
        run: python scripts/patch_policy_stats.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.js
          git diff --cached --quiet || git commit -m "Document statistics and ranking system in policy"
          git push
