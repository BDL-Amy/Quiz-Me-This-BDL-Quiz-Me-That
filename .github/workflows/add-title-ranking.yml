name: Add title statistics and ranking
on:
  push:
    paths:
      - '.github/workflows/add-title-ranking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add title statistics and ranking
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          css='''\n.title-summary{\n  margin-top:18px;\n}\n\n.title-points-note{\n  background:#fff;\n  border:1px solid var(--stats-light);\n  border-radius:14px;\n  padding:12px;\n  margin:12px 0 16px;\n  text-align:center;\n  font-size:14px;\n}\n\n.title-leader-row{\n  display:grid;\n  grid-template-columns:38px 1fr 58px 58px 58px;\n  gap:6px;\n  align-items:center;\n  padding:10px 8px;\n  border-bottom:1px solid #eee;\n  font-size:13px;\n}\n\n.title-leader-row.header{\n  font-weight:bold;\n  background:var(--stats-bg);\n}\n\n.title-leader-row.me{\n  background:var(--stats-light);\n}\n'''
          marker='\n.wall-card{'
          if '.title-summary{' not in s:
              s=s.replace(marker,css+marker,1)
          old='''        </div>\n\n        <div class="tabs">'''
          new='''        </div>\n\n        ${renderPersonalTitleStats(data)}\n\n        <div class="tabs">'''
          if '${renderPersonalTitleStats(data)}' not in s:
              s=s.replace(old,new,1)
          old2='''        <div id="rankingArea"></div>\n\n      </div>'''
          new2='''        <div id="rankingArea"></div>\n\n        ${renderTitleRanking(data)}\n\n      </div>'''
          if '${renderTitleRanking(data)}' not in s:
              s=s.replace(old2,new2,1)
          js='''\n\nfunction buildTitleRanking(data){\n  const history=data?.history||{};\n  const weekly=Array.isArray(history.weekly)?history.weekly:[];\n  const monthly=Array.isArray(history.monthly)?history.monthly:[];\n  const players=new Map();\n  const add=(name,type)=>{\n    const clean=String(name||\"\").trim();\n    if(!clean)return;\n    const key=clean.toLowerCase();\n    if(!players.has(key))players.set(key,{player_name:clean,smartest:0,supreme:0,points:0});\n    const row=players.get(key);\n    if(type===\"smartest\")row.smartest+=1;\n    if(type===\"supreme\")row.supreme+=1;\n    row.points=row.smartest+(row.supreme*4);\n  };\n  weekly.forEach(row=>add(row.player_name,\"smartest\"));\n  monthly.forEach(row=>add(row.player_name,\"supreme\"));\n  const rows=[...players.values()].sort((a,b)=>b.points-a.points||b.supreme-a.supreme||b.smartest-a.smartest||a.player_name.localeCompare(b.player_name));\n  let rank=0,lastPoints=null,lastSupreme=null,lastSmartest=null;\n  rows.forEach((row,index)=>{\n    if(row.points!==lastPoints||row.supreme!==lastSupreme||row.smartest!==lastSmartest)rank=index+1;\n    row.rank=rank;\n    lastPoints=row.points;lastSupreme=row.supreme;lastSmartest=row.smartest;\n  });\n  return rows;\n}\n\nfunction renderPersonalTitleStats(data){\n  const rows=buildTitleRanking(data);\n  const me=rows.find(row=>String(row.player_name).toLowerCase()===String(playerName()).toLowerCase())||{smartest:0,supreme:0,points:0};\n  return `\n    <div class=\"title-summary\">\n      <h3 class=\"center\">MY TITLES</h3>\n      <div class=\"stat-grid\">\n        <div class=\"stat-card\"><strong>${me.smartest}</strong>Smartest wins</div>\n        <div class=\"stat-card\"><strong>${me.supreme}</strong>Supreme wins</div>\n      </div>\n      <div class=\"stat-card\" style=\"margin-top:10px\"><strong>${me.points}</strong>Title Points</div>\n      <div class=\"title-points-note\"><strong>HOW TITLE POINTS ARE CALCULATED</strong><br><br>Smartest BDL'er of the Week = <strong>1 point per win</strong><br>Supreme BDL'er of the Month = <strong>4 points per win</strong><br><br><strong>Total Title Points = Smartest wins + (Supreme wins × 4)</strong></div>\n    </div>`;\n}\n\nfunction renderTitleRanking(data){\n  const rows=buildTitleRanking(data).slice(0,20);\n  let body='';\n  if(!rows.length){\n    body='<div class=\"notice\">No title winners are available yet.</div>';\n  }else{\n    body='<div class=\"leaderboard\"><div class=\"title-leader-row header\"><span>#</span><span>Player</span><span>Smartest</span><span>Supreme</span><span>Points</span></div>';\n    rows.forEach(row=>{\n      const me=String(row.player_name).toLowerCase()===String(playerName()).toLowerCase();\n      body+=`<div class=\"title-leader-row ${me?'me':''}\"><strong>#${row.rank}</strong><span>${html(row.player_name)}</span><span>${row.smartest}</span><span>${row.supreme}</span><strong>${row.points}</strong></div>`;\n    });\n    body+='</div>';\n  }\n  return `<div style=\"margin-top:30px\"><h3 class=\"center\">TITLE RANKING — TOP 20</h3><div class=\"title-points-note\">This is a separate title ranking and does not affect the general quiz ranking.</div>${body}</div>`;\n}\n'''
          marker2='\n/* MY STATISTICS */'
          if 'function buildTitleRanking(data)' not in s:
              s=s.replace(marker2,js+marker2,1)
          p.write_text(s)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Build title statistics and Top 20 ranking"
          git push