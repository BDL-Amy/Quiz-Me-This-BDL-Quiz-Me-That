name: Fix Question 49
on:
  push:
    paths:
      - '.github/workflows/fix-question-49.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put Bubu question in slot 49
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          q='''{
  question:
    "Bubu found a big bag with a lot of money once. What did she do with it?",
  answers:[
    "She went to the bank and put all the money in her account",
    "She went shopping and bought herself an expensive dress",
    "She took the bag home, informed the police and was rewarded for her honesty.",
    "She left the bag where she found it"
  ],
  correct:2
}'''
          old='''{
},

'''+q+''',

{
  question:
    "We have already reached Question 50'''
          new=q+''',

{
  question:
    "We have already reached Question 50'''
          if old not in s:
              raise SystemExit('Expected empty Question 49 + duplicate Bubu block not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix Question 49" || exit 0
          git push
# trigger repair now
