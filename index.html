/* DATE & TIME */

function brussels(){

  const parts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"Europe/Brussels",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        hourCycle:"h23"
      }
    ).formatToParts(new Date());

  return Object.fromEntries(
    parts
      .filter(
        p=>p.type!=="literal"
      )
      .map(
        p=>[
          p.type,
          p.value
        ]
      )
  );
}


function effectiveDate(){

  const p =
    brussels();

  const d =
    new Date(
      +p.year,
      +p.month-1,
      +p.day
    );

  if(+p.hour < 8){
    d.setDate(
      d.getDate()-1
    );
  }

  return d;
}


function dateString(d){

  return [
    d.getFullYear(),

    String(
      d.getMonth()+1
    ).padStart(2,"0"),

    String(
      d.getDate()
    ).padStart(2,"0")

  ].join("-");
}


function quizDay(){

  const start =
    new Date(
      2026,
      7,
      11
    );

  return Math.round(
    (
      effectiveDate()
      -
      start
    )
    /
    86400000
  );
}


function currentWeekStart(){

  const d =
    effectiveDate();

  const day =
    d.getDay() || 7;

  d.setDate(
    d.getDate()
    -
    day
    +
    1
  );

  return dateString(d);
}


function previousWeekStart(){

  const d =
    effectiveDate();

  const day =
    d.getDay() || 7;

  d.setDate(
    d.getDate()
    -
    day
    -
    6
  );

  return dateString(d);
}


function currentMonthStart(){

  const d =
    effectiveDate();

  return dateString(
    new Date(
      d.getFullYear(),
      d.getMonth(),
      1
    )
  );
}

function playerId(){

  let id =
    localStorage.getItem(
      "bdlPlayerId"
    );

  if(!id){

    if(
      crypto.randomUUID
    ){
      id =
        crypto.randomUUID();

    }else{

      id =
        "bdl-"
        +
        Date.now()
        +
        "-"
        +
        Math.random()
          .toString(36)
          .slice(2);
    }

    localStorage.setItem(
      "bdlPlayerId",
      id
    );
  }

  return id;
}

/* GENERAL HELPERS */

function html(text){

  return String(
    text ?? ""
  )
  .replaceAll(
    "&",
    "&amp;"
  )
  .replaceAll(
    "<",
    "&lt;"
  )
  .replaceAll(
    ">",
    "&gt;"
  )
  .replaceAll(
    '"',
    "&quot;"
  );
}

async function api(
  url,
  body
){

  const response =
    await fetch(
      url,
      {
        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(body)
      }
    );

  const data =
    await response
      .json()
      .catch(()=>({}));

  if(!response.ok){

    throw new Error(
      data.error
      ||
      "Something went wrong."
    );
  }

  return data;
}

          Today's question
          is not available yet.
        </div>

      </div>

      ${back("showQuizMenu")}
    `);

    return;
  }

  const existing =
    savedAnswer(index);

  selectedAnswer =
    existing;

  let answersHtml = "";

  q.answers.forEach(
    (answer,i)=>{

      const letter =
        String.fromCharCode(
          65+i
        );

      const selected =
        existing === i
        ? "selected"
        : "";

      const click =
        existing === null
        ? `onclick="selectAnswer(${i})"`
        : "";

      answersHtml += `
        <button
          id="answer-${i}"
          class="${selected}"
          ${click}>
          ${letter}/
          ${html(answer)}
        </button>
      `;
    }
  );

  if(existing !== null){

    page(`
      <div class="section quiz-section">

        <h2 class="center">
          QUESTION
          ${questionNumber(index)}
        </h2>

        <div class="notice">
          You already answered
          today's question.
        </div>

        <h3>
          ${html(q.question)}
        </h3>

        ${answersHtml}

        <div class="answer">

          <strong>
            Your answer:
          </strong>

          ${
            String.fromCharCode(
              65+existing
            )
          }/
          ${html(q.answers[existing])}

        </div>

        <p class="center">
          The correct answer
          will be revealed tomorrow.
        </p>

      </div>

      ${back("showQuizMenu")}
    `);

    return;
  }

  page(`
    <div class="section quiz-section">

      <h2 class="center">
        QUESTION
        ${questionNumber(index)}
      </h2>

      <h3>
        ${html(q.question)}
      </h3>

      <div id="answerButtons">
        ${answersHtml}
      </div>

      <button
        id="submitButton"
        class="center"
        onclick="submitAnswer()"
        disabled>
        SUBMIT ANSWER
      </button>

    </div>

    ${back("showQuizMenu")}
  `);
}


function selectAnswer(index){

  selectedAnswer =
    index;

  document
    .querySelectorAll(
      "#answerButtons button"
    )
    .forEach(
      button=>
        button.classList.remove(
          "selected"
        )
    );

  document
    .getElementById(
      "answer-"+index
    )
    .classList.add(
      "selected"
    );

  document
    .getElementById(
      "submitButton"
    )
    .disabled =
      false;
}


async function submitAnswer(){

  const index =
    quizDay();

  const q =
    questions[index];

  if(
    selectedAnswer === null
    ||
    !q
  ){
    return;
  }

  const button =
    document.getElementById(
      "submitButton"
    );

  if(button){

    button.disabled =
      true;

    button.textContent =
      "SUBMITTING...";
  }

  try{

    await api(
  QUIZ_SERVICE,
  {
    action:"submit_answer",
    player_id:playerId(),
    player_name:playerName(),
    quiz_date:dateString(effectiveDate()),
    question_num:questionNumber(index),
    answer:String.fromCharCode(65+selectedAnswer),
    is_correct:selectedAnswer === q.correct
  }
);

    storeAnswer(
      index,
      selectedAnswer
    );

    dashboardCache =
      null;

    showThankYouPage();

  }catch(error){

    if(button){

      button.disabled =
        false;

      button.textContent =
        "SUBMIT ANSWER";
    }

    alert(
      error.message
      ||
      "Your answer could not be submitted."
    );
  }
}

/* PUSH HELPERS */

function urlBase64ToUint8Array(
  base64String
){

  const padding =
    "=".repeat(
      (
        4
        -
        base64String.length % 4
      )
      % 4
    );

  const base64 =
    (
      base64String
      +
      padding
    )
    .replace(
      /-/g,
      "+"
    )
    .replace(
      /_/g,
      "/"
    );

  const rawData =
    atob(base64);

  return Uint8Array.from(
    [...rawData]
      .map(
        char =>
          char.charCodeAt(0)
      )
  );
}


function pushSupported(){

  return (
    "serviceWorker"
    in navigator
    &&
    "PushManager"
    in window
    &&
    "Notification"
    in window
  );
}


async function getPushRegistration(){

  if(!pushSupported()){
    return null;
  }

  return await navigator
    .serviceWorker
    .register(
      "./service-worker.js"
    );
}


async function getCurrentPushSubscription(){

  const registration =
    await getPushRegistration();

  if(!registration){
    return null;
  }

  return await registration
    .pushManager
    .getSubscription();
}


async function refreshPushStatus(){

  const status =
    document.getElementById(
      "pushStatus"
    );

  const button =
    document.getElementById(
      "pushButton"
    );

  if(
    !status
    ||
    !button
  ){
    return;
  }

  if(!pushSupported()){

    status.textContent =
      "Push notifications are not supported on this device.";

    button.textContent =
      "NOT AVAILABLE";

    button.disabled =
      true;

    return;
  }

  try{

    const subscription =
      await getCurrentPushSubscription();

    if(subscription){

      status.innerHTML =
        "<strong>Status: ON</strong>";

      button.textContent =
        "DISABLE PUSH NOTIFICATIONS";

    }else{

      status.innerHTML =
        "<strong>Status: OFF</strong>";

      button.textContent =
        "ENABLE PUSH NOTIFICATIONS";
    }

    button.disabled =
      false;

  }catch(error){

    status.textContent =
      "Push status could not be checked.";

    button.textContent =
      "TRY AGAIN";

    button.disabled =
      false;
  }
}


async function togglePushNotifications(){

  const subscription =
    await getCurrentPushSubscription();

  if(subscription){
    await disablePushNotifications(
      subscription
    );

  }else{
    await enablePushNotifications();
  }

  await refreshPushStatus();
}


async function enablePushNotifications(){

  if(!pushSupported()){

    alert(
      "Push notifications are not supported on this device."
    );

    return;
  }

  let permission =
    Notification.permission;

  if(
    permission ===
    "default"
  ){

    permission =
      await Notification
        .requestPermission();
  }

  if(
    permission !==
    "granted"
  ){

    alert(
      "Push notifications were not enabled."
    );

    return;
  }

  const registration =
    await getPushRegistration();

  const keyData =
    await api(
      PUSH_SERVICE,
      {
        action:
          "public_key"
      }
    );

  if(
    !keyData.public_key
  ){

    throw new Error(
      "Push key is unavailable."
    );
  }

  let subscription =
    await registration
      .pushManager
      .getSubscription();

  if(!subscription){

    subscription =
      await registration
        .pushManager
        .subscribe({
          userVisibleOnly:true,

          applicationServerKey:
            urlBase64ToUint8Array(
              keyData.public_key
            )
        });
  }

  await api(
    PUSH_SERVICE,
    {
      action:
        "subscribe",

      subscription:
        subscription.toJSON(),

      player_id:
        playerId(),

      player_name:
        playerName()
    }
  );

  alert(
    "Push notifications are now enabled."
  );
}


async function disablePushNotifications(
  subscription
){

  if(!subscription){

    subscription =
      await getCurrentPushSubscription();
  }

  if(!subscription){
    return;
  }

  await api(
    PUSH_SERVICE,
    {
      action:
        "unsubscribe",

      endpoint:
        subscription.endpoint
    }
  );

  await subscription
    .unsubscribe();

  alert(
    "Push notifications are now disabled."
  );
}
