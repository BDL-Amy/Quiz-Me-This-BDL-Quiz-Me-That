function getBrusselsParts(){
  const parts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"Europe/Brussels",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hourCycle:"h23",
        weekday:"long"
      }
    ).formatToParts(new Date());

  const value = {};

  parts.forEach(part=>{
    if(part.type !== "literal"){
      value[part.type] = part.value;
    }
  });

  return value;
}

function getEffectiveQuizDate(){
  const p = getBrusselsParts();

  const d =
    new Date(
      Number(p.year),
      Number(p.month)-1,
      Number(p.day)
    );

  if(Number(p.hour) < 8){
    d.setDate(d.getDate()-1);
  }

  return d;
}

function formatDateLocal(date){
  return (
    date.getFullYear()
    + "-"
    + String(date.getMonth()+1).padStart(2,"0")
    + "-"
    + String(date.getDate()).padStart(2,"0")
  );
}

function getQuizDay(){
  const effective = getEffectiveQuizDate();
  const start = new Date(2026,7,11);

  return Math.round(
    (
      new Date(
        effective.getFullYear(),
        effective.getMonth(),
        effective.getDate()
      )
      -
      start
    )
    /
    86400000
  );
}

function isMondayFlow(){
  if(TEST_MONDAY){
    return true;
  }

  const p = getBrusselsParts();

  const today =
    new Date(
      Number(p.year),
      Number(p.month)-1,
      Number(p.day)
    );

  const firstWeeklyResultsDate =
    new Date(2026, 7, 24);

  return (
    p.weekday === "Monday"
    &&
    Number(p.hour) >= 8
    &&
    today >= firstWeeklyResultsDate
  );
}

function getPlayerName(){
  return localStorage.getItem("bdlPlayerName") || "";
}

function setPlayerName(name){
  localStorage.setItem("bdlPlayerName",name.trim());
}

function getPlayerId(){
  let id =
    localStorage.getItem("bdlPlayerId");

  if(!id){
    if(window.crypto && crypto.randomUUID){
      id = crypto.randomUUID();
    }else{
      id =
        "bdl-"
        + Date.now()
        + "-"
        + Math.random().toString(36).slice(2);
    }

    localStorage.setItem("bdlPlayerId",id);
  }

  return id;
}

function getQuestionNumber(index){
  return FIRST_QUESTION_NUMBER + index;
}

function getStorageKey(index){
  return "bdlQuizAnswer_" + getQuestionNumber(index);
}

function getSavedAnswer(index){
  const saved =
    localStorage.getItem(getStorageKey(index));

  if(saved === null){
    return null;
  }

  try{
    const parsed =
      JSON.parse(saved);

    if(
      typeof parsed === "object"
      &&
      parsed !== null
      &&
      parsed.selected !== undefined
    ){
      return Number(parsed.selected);
    }

    return Number(parsed);

  }catch{
    return Number(saved);
  }
}

function saveAnswer(index,selected){
  localStorage.setItem(
    getStorageKey(index),
    JSON.stringify({selected:selected})
  );
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

async function postJson(url,body){
  const response =
    await fetch(
      url,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify(body)
      }
    );

  const data =
    await response.json().catch(()=>null);

  if(!response.ok || !data){
    throw new Error(
      data?.error
      ||
      "Unable to contact the quiz service."
    );
  }

  return data;
}

function getPreviousWeekStart(){
  const current = getEffectiveQuizDate();

  const monday =
    new Date(
      current.getFullYear(),
      current.getMonth(),
      current.getDate()
    );

  const day = monday.getDay();

  const distanceFromMonday =
    day === 0 ? 6 : day - 1;

  monday.setDate(
    monday.getDate()
    - distanceFromMonday
    - 7
  );

  return formatDateLocal(monday);
}

function dateToQuestionIndex(dateString){
  const [year,month,day] =
    dateString.split("-").map(Number);

  const date =
    new Date(
      year,
      month-1,
      day
    );

  const start =
    new Date(
      2026,
      7,
      11
    );

  return Math.round(
    (date-start)/86400000
  );
}

function dayName(dateString){
  const [year,month,day] =
    dateString.split("-").map(Number);

  return new Intl.DateTimeFormat(
    "en-US",
    {weekday:"long"}
  ).format(
    new Date(
      year,
      month-1,
      day
    )
  );
}

  setPlayerName(name);
  getPlayerId();
  showStartScreen();

    getQuizDay();

  if(quizDay > 0){

  }else{

async function showYesterdayPage(){
  const quiz =
    document.getElementById("quiz");

  const quizDay =
    getQuizDay();

  const previousIndex =
    quizDay - 1;

  if(previousIndex < 0 || previousIndex >= questions.length){
    showAfterYesterday();
    return;
  }

  quiz.innerHTML = `
    <div class="answer center">
      Loading your answer...
    </div>
  `;

  const q =
    questions[previousIndex];

  const questionNumber =
    getQuestionNumber(previousIndex);

  let selected =
    getSavedAnswer(previousIndex);

  if(!TEST_MONDAY){
    try{
      const data =
        await postJson(
          QUIZ_SERVICE,
          {
            action:"get_answer",
            player_id:getPlayerId(),
            question_num:questionNumber
          }
        );

      if(data.answered && data.answer){
        const letter =
          String(data.answer.answer || "")
            .trim()
            .toUpperCase();

        const index =
          ["A","B","C","D"].indexOf(letter);

        if(index >= 0){
          selected = index;
        }
      }

    }catch(error){
      console.log("Using local answer fallback.");
    }
  }

  const yourAnswer =
    selected === null

    ? `
      <p>
        <strong>Your answer:</strong><br>
        You did not answer yesterday's question.
      </p>
    `

    : `
      <p>
        <strong>Your answer:</strong><br>
        ${String.fromCharCode(65+selected)}.
        ${escapeHtml(q.answers[selected])}
      </p>
    `;

  let resultText = "";

  if(selected !== null){
    resultText =
      selected === q.correct

      ? `
        <p>
          <strong>
            You got it right!
          </strong>
        </p>
      `

      : `
        <p>
          <strong>
            Better luck today!
          </strong>
        </p>
      `;
  }

  const nextButton =
    isMondayFlow()

    ? `
      <button
        class="center"
        onclick="showWeekResults()">
        SHOW MY WEEK RESULTS
      </button>
    `

    : `
      <button
        class="center"
        onclick="showTodayQuestion()">
        CONTINUE
      </button>
    `;

  quiz.innerHTML = `
    <div class="answer">

      <h2>
        Yesterday's Question - Question ${questionNumber}
      </h2>

      <p>
        <strong>
          ${escapeHtml(q.question)}
        </strong>
      </p>

      ${yourAnswer}

      <p>
        <strong>
          The correct answer:
        </strong><br>

        ${String.fromCharCode(65+q.correct)}.
        ${escapeHtml(q.answers[q.correct])}
      </p>

      ${resultText}

    </div>

    ${nextButton}
  `;
}

function showAfterYesterday(){
  if(isMondayFlow()){
    showWeekResults();
  }else{
    showTodayQuestion();
  }
}

async function showWeekResults(){
  const quiz =
    document.getElementById("quiz");

  const name =
    getPlayerName();

  quiz.innerHTML = `
    <div class="answer center">
      Loading your week results,
      ${escapeHtml(name)}...
    </div>
  `;

  if(TEST_MONDAY){
    showTestWeekResults();
    return;
  }

  try{
    const weekStart =
      getPreviousWeekStart();

    const data =
      await postJson(
        RESULTS_SERVICE,
        {
          action:"week_summary",
          player_id:getPlayerId(),
          week_start:weekStart
        }
      );

    renderWeekResults(data);

  }catch(error){

    quiz.innerHTML = `
      <div class="answer">
        <h2>
          MY WEEK RESULTS
        </h2>

        <p>
          We couldn't load your weekly results right now.
        </p>
      </div>

      <button
        class="center"
        onclick="showWeeklyWinner()">
        SMARTEST BDL'er OF THE WEEK
      </button>
    `;
  }
}

function renderWeekResults(data){
  const quiz =
    document.getElementById("quiz");

  const answersByDate =
    new Map();

  (data.answers || []).forEach(row=>{
    answersByDate.set(
      row.quiz_date,
      row
    );
  });

  const start =
    new Date(
      data.week_start + "T00:00:00"
    );

  let rowsHtml = "";

  for(let i=0;i<7;i++){
    const date =
      new Date(start);

    date.setDate(
      start.getDate()+i
    );

    const dateString =
      formatDateLocal(date);

    const row =
      answersByDate.get(dateString);

    const questionIndex =
      dateToQuestionIndex(dateString);

    const q =
      questions[questionIndex] || null;

    if(!row){
      rowsHtml += `
        <div class="day-result">
          <strong>
            ${dayName(dateString)}
          </strong>

          <br><br>

          <span class="muted">
            Not answered
          </span>
        </div>
      `;
      continue;
    }

    const selectedLetter =
      String(row.answer || "")
        .trim()
        .toUpperCase();

    const selectedIndex =
      ["A","B","C","D"]
        .indexOf(selectedLetter);

    const yourText =
      q && selectedIndex >= 0

      ? (
          selectedLetter
          + ". "
          + escapeHtml(q.answers[selectedIndex])
        )

      : escapeHtml(row.answer);

    const correctText =
      q

      ? (
          String.fromCharCode(65+q.correct)
          + ". "
          + escapeHtml(q.answers[q.correct])
        )

      : (
          row.is_correct
          ? "Correct"
          : "Incorrect"
        );

    rowsHtml += `
      <div class="day-result">

        <strong>
          ${dayName(dateString)}
        </strong>

        <br><br>

        <strong>
          Your answer:
        </strong><br>

        ${yourText}

        <br><br>

        <strong>
          Correct answer:
        </strong><br>

        ${correctText}

        <br><br>

        <strong>
          ${
            row.is_correct
            ? "Correct"
            : "Incorrect"
          }
        </strong>

      </div>
    `;
  }

  quiz.innerHTML = `
    <div class="answer">

      <h2 class="center">
        MY WEEK RESULTS
      </h2>

      ${rowsHtml}

      <div class="total">
        TOTAL:
        ${Number(data.correct || 0)}/7 CORRECT
      </div>

    </div>

    <button
      class="center"
      onclick="showWeeklyWinner()">
      SMARTEST BDL'er OF THE WEEK
    </button>
  `;
}

      class="center"
      onclick="showWeeklyWinner()">
      SMARTEST BDL'er OF THE WEEK
    </button>
  `;
}

async function showWeeklyWinner(){
  const quiz =
    document.getElementById("quiz");

  quiz.innerHTML = `
    <div class="answer center">
      Loading the SMARTEST BDL'er OF THE WEEK...
    </div>
  `;

  if(TEST_MONDAY){
    renderWeeklyWinner("TEST WINNER");
    return;
  }

  try{
    const data =
      await postJson(
        RESULTS_SERVICE,
        {
          action:"weekly_winner",
          week_start:getPreviousWeekStart()
        }
      );

    if(data.winner && data.winner.player_name){
      renderWeeklyWinner(
        data.winner.player_name
      );
    }else{
      quiz.innerHTML = `
        <div class="answer center">

          <h2>
            SMARTEST BDL'er OF THE WEEK
          </h2>

          <p>
            The weekly winner is not available yet.
          </p>

        </div>

        <button
          class="center"
          onclick="showTodayQuestion()">
          CONTINUE TO THE QUIZ
        </button>
      `;
    }

  }catch(error){

    quiz.innerHTML = `
      <div class="answer center">

        <h2>
          SMARTEST BDL'er OF THE WEEK
        </h2>

        <p>
          The weekly winner could not be loaded.
        </p>

      </div>

      <button
        class="center"
        onclick="showTodayQuestion()">
        CONTINUE TO THE QUIZ
      </button>
    `;
  }
}

function renderWeeklyWinner(winnerName){
  const quiz =
    document.getElementById("quiz");

  quiz.innerHTML = `
    <div class="answer center">

      <h2>
        SMARTEST BDL'er OF THE WEEK
      </h2>

      <p>
        Another week of questions,
        clever answers and a little bit of luck...
      </p>

      <p>
        But one BDL'er came out on top!
      </p>

      <h2>
        This week's SMARTEST BDL'er is...
      </h2>

      <h1>
        ${escapeHtml(winnerName)}
      </h1>

      <p>
        <strong>
          Congratulations!
        </strong>
      </p>

      <p>
        Enjoy the glory - at least until next Monday.
      </p>

    </div>

    <button
      class="center"
      onclick="showTodayQuestion()">
      CONTINUE TO THE QUIZ
    </button>
  `;
}

let pendingAnswer = null;

function showTodayQuestion(){
  const quiz =
    document.getElementById("quiz");

  const quizDay =
    getQuizDay();

  if(quizDay < 0 || quizDay >= questions.length){
    showStartScreen();
    return;
  }

  const q =
    questions[quizDay];

  const questionNumber =
    getQuestionNumber(quizDay);

  pendingAnswer = null;

  quiz.innerHTML = `
    <h2>
      Question ${questionNumber}
    </h2>

    <p>
      <strong>
        ${escapeHtml(q.question)}
      </strong>
    </p>

    <div id="answerButtons"></div>

    <div id="submitArea"></div>
  `;

  renderAnswerButtons();
}

function renderAnswerButtons(){
  const quizDay =
    getQuizDay();

  const q =
    questions[quizDay];

  const answerButtons =
    document.getElementById("answerButtons");

  answerButtons.innerHTML =
    q.answers.map(
      (answer,index)=>`

        <button
          class="${
            pendingAnswer === index
            ? "selected"
            : ""
          }"
          onclick="selectAnswer(${index})">

          ${String.fromCharCode(65+index)}.
          ${escapeHtml(answer)}

        </button>

      `
    ).join("");
}

function selectAnswer(index){
  pendingAnswer = index;

  renderAnswerButtons();

  const q =
    questions[getQuizDay()];

  const submitArea =
    document.getElementById("submitArea");

  submitArea.innerHTML = `
    <div class="answer">

      <strong>
        Your choice:
      </strong><br>

      ${String.fromCharCode(65+index)}.
      ${escapeHtml(q.answers[index])}

      <br><br>

      <span class="muted">
        You can still change your choice before submitting.
      </span>

    </div>

    <button
      class="center"
      onclick="submitAnswer()">
      SUBMIT ANSWER
    </button>
  `;
}

async function submitAnswer(){
  const quizDay =
    getQuizDay();

  if(
    pendingAnswer === null
    ||
    quizDay < 0
    ||
    quizDay >= questions.length
  ){
    return;
  }

  const q =
    questions[quizDay];

  const selected =
    pendingAnswer;

  if(
    !TEST_MONDAY
    &&
    getSavedAnswer(quizDay) !== null
  ){
    showStartScreen();
    return;
  }

  if(TEST_MONDAY){
    showThankYouPage(selected);
    return;
  }

  const quiz =
    document.getElementById("quiz");

  quiz.innerHTML = `
    <div class="answer center">
      Saving your answer...
    </div>
  `;

  try{
    const result =
      await postJson(
        QUIZ_SERVICE,
        {
          action:"submit_answer",
          player_id:getPlayerId(),
          player_name:getPlayerName(),
          quiz_date:formatDateLocal(getEffectiveQuizDate()),
          question_num:getQuestionNumber(quizDay),
          answer:String.fromCharCode(65+selected),
          is_correct:selected === q.correct
        }
      );

    let savedSelected =
      selected;

    if(result.already_answered && result.answer){
      const existingLetter =
        String(result.answer.answer || "")
          .trim()
          .toUpperCase();

      const existingIndex =
        ["A","B","C","D"]
          .indexOf(existingLetter);

      if(existingIndex >= 0){
        savedSelected =
          existingIndex;
      }
    }

    saveAnswer(
      quizDay,
      savedSelected
    );

    showThankYouPage(
      savedSelected
    );

  }catch(error){

    quiz.innerHTML = `
      <div class="answer">

        <h2>
          We couldn't save your answer.
        </h2>

        <p>
          Please try again.
        </p>

      </div>

      <button
        class="center"
        onclick="showTodayQuestion()">
        TRY AGAIN
      </button>
    `;
  }
}

function showThankYouPage(selected){
  const quiz =
    document.getElementById("quiz");

  const quizDay =
    getQuizDay();

  const name =
    getPlayerName();

  const q =
    questions[quizDay];

  const questionNumber =
    getQuestionNumber(quizDay);

  quiz.innerHTML = `
    <div class="answer">

      <h2>
        ${escapeHtml(name)},
        thanks for playing today!
      </h2>

      <p>
        <strong>
          Question ${questionNumber}
        </strong>
      </p>

      <p>
        <strong>
          The question was:
        </strong><br>

        ${escapeHtml(q.question)}
      </p>

      <p>
        <strong>
          You answered:
        </strong><br>

        ${String.fromCharCode(65+selected)}.
        ${escapeHtml(q.answers[selected])}
      </p>

      <p>
        <strong>
          Stay tuned!
        </strong><br>

        The correct answer will be revealed
        tomorrow together with a new Daily Quiz.
      </p>

    </div>
  `;
}

getPlayerId();
showStartScreen();

</script>
</body>
</html>
