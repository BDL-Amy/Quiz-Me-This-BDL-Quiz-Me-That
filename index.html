/* DATE & TIME */

function brussels(){

  const parts =
    new Intl.DateTimeFormat(
      "en-GB",
      {
        timeZone:"Europe/Brussels",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        hourCycle:"h23"
      }
    ).formatToParts(new Date());

  return Object.fromEntries(
    parts
      .filter(
        p=>p.type!=="literal"
      )
      .map(
        p=>[
          p.type,
          p.value
        ]
      )
  );
}


function effectiveDate(){

  const p =
    brussels();

  const d =
    new Date(
      +p.year,
      +p.month-1,
      +p.day
    );

  if((+p.hour * 60 + +p.minute) < 930){
    d.setDate(
      d.getDate()-1
    );
  }

  return d;
}


function dateString(d){

  return [
    d.getFullYear(),

    String(
      d.getMonth()+1
    ).padStart(2,"0"),

    String(
      d.getDate()
    ).padStart(2,"0")

  ].join("-");
}


function quizDay(){

  const start =
    new Date(
      2026,
      7,
      11
    );

  return Math.round(
    (
      effectiveDate()
      -
      start
    )
    /
    86400000
  );
}


function currentWeekStart(){
  const d=effectiveDate();
  /* Statistics roll over on Monday. The stats week shown Mon-Sun belongs
     to the quiz week that started on the preceding Saturday. */
  const day=d.getDay() || 7;
  d.setDate(d.getDate()-day-1);
  return dateString(d);
}


function previousWeekStart(){
  const d=effectiveDate();
  const day=d.getDay() || 7;
  d.setDate(d.getDate()-day-8);
  return dateString(d);
}


function currentMonthStart(){

  const d =
    effectiveDate();

  return dateString(
    new Date(
      d.getFullYear(),
      d.getMonth(),
      1
    )
  );
}


function previousMonthStart(){

  const d = effectiveDate();

  return dateString(
    new Date(
      d.getFullYear(),
      d.getMonth()-1,
      1
    )
  );
}

async function api(
  url,
  body
){
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),12000);
  let response;
  try{
    response =
      await fetch(
        url,
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify(body),
          signal:controller.signal
        }
      );
  }catch(error){
    if(error?.name==="AbortError") throw new Error("The server took too long to respond.");
    throw error;
  }finally{
    clearTimeout(timeout);
  }

  const data =
    await response
      .json()
      .catch(()=>({}));

  if(!response.ok){

    throw new Error(
      data.error
      ||
      "Something went wrong."
    );
  }

  return data;
}

let pendingWinnerAnnouncements = [];


function winnerAnnouncementKey(type, period){
  return [
    "bdlWinnerAnnouncementSeen",
    playerId(),
    type,
    period
  ].join("_");
}


function shouldOfferWinnerAnnouncement(type, period){
  return localStorage.getItem(
    winnerAnnouncementKey(type, period)
  ) !== "yes";
}


async function loadWinnerAnnouncements(){

  const d = effectiveDate();
  const now = brussels();
  const actualDate = new Date(+now.year,+now.month-1,+now.day);
  const afterSundayRelease = actualDate.getDay() === 0 && (+now.hour * 60 + +now.minute) >= 930; // Sunday winner-preview release gate
  const announcements = [];
  const internalAccount = (typeof isTestIdentity==="function" && isTestIdentity()) || ["amy.test","drbdl.test"].includes(String(playerName()||"").normalize("NFKC").trim().replace(/\s+/g," ").toLocaleLowerCase("en"));

  /* Confidential Sunday preview: only Amy / BDL admin & test identities. */
  if(afterSundayRelease && internalAccount){
    const sunday = dateString(actualDate);
    try{
      /* Sunday 15:30 finalises the Saturday-Friday quiz week internally.
         Public statistics/title rollover remains Monday. */
      /* The completed quiz week is Saturday-Friday; Sunday 15:30 releases Friday's result. */
      const weekStart=dateString(new Date(actualDate.getFullYear(),actualDate.getMonth(),actualDate.getDate()-8));
      const [finalWeek,data] = await Promise.all([
        api(RESULTS_SERVICE,{action:"weekly_winner",week_start:weekStart}).catch(()=>null),
        api(RESULTS_SERVICE,{
          action:"admin_winner_preview",
          player_id:playerId(),
          player_name:playerName(),
          week_start:weekStart,
          month_start:currentMonthStart()
        }).catch(()=>null)
      ]);
      const weekWinners=finalWeek?.winner?.player_name
        ? [finalWeek.winner]
        : (Array.isArray(data?.week?.winners)?data.week.winners:[]);
      const monthWinners=Array.isArray(data?.month?.winners)?data.month.winners:[];
      if(weekWinners.length && shouldOfferWinnerAnnouncement("admin-weekly-preview",sunday)) announcements.push({type:"admin-weekly-preview",period:sunday,winner:{player_name:weekWinners.map(x=>x.player_name).join(" & ")}});
      if(monthWinners.length && shouldOfferWinnerAnnouncement("admin-monthly-preview",sunday)) announcements.push({type:"admin-monthly-preview",period:sunday,winner:{player_name:monthWinners.map(x=>x.player_name).join(" & ")}});
    }catch(error){console.error("Admin winner preview could not be loaded.",error);}
  }

  /* Once a weekly winner is officially published, every player must receive
     the announcement on their next START. localStorage ensures it is shown once
     per published winning period, regardless of what day they next open the quiz. */
  try{
    const data = await api(RESULTS_SERVICE,{action:"latest_weekly_winner"});
    const winner = data?.winner?.player_name ? data.winner : {player_name:"Nunya",week_start:"2026-09-14",week_end:"2026-09-19"};
    const period = winner.week_start || "2026-09-14";
    if(shouldOfferWinnerAnnouncement("weekly",period)){
      announcements.push({type:"weekly",period,winner});
    }
  }catch(error){
    console.error("Weekly winner announcement could not be loaded.",error);
    const winner={player_name:"Nunya",week_start:"2026-09-14",week_end:"2026-09-19"};
    if(shouldOfferWinnerAnnouncement("weekly",winner.week_start)){
      announcements.push({type:"weekly",period:winner.week_start,winner});
    }
  }

  if(
    d.getDate() === 1
    && shouldOfferWinnerAnnouncement(
      "monthly",
      previousMonthStart()
    )
  ){
    try{
      const response = await fetch(
        MONTHLY_WINNER_SERVICE,
        {cache:"no-store"}
      );
      const data = await response.json().catch(()=>({}));

      if(response.ok && data?.winner?.player_name){
        announcements.push({
          type:"monthly",
          period:previousMonthStart(),
          winner:data.winner
        });
      }
    }catch(error){}
  }

  return announcements;
}

function buildTitleRanking(data){
  const history=data?.history||{};
  const weekly=Array.isArray(history.weekly)?history.weekly:[];
  const monthly=Array.isArray(history.monthly)?history.monthly:[];
  const players=new Map();
  const add=(name,type)=>{
    const clean=String(name||"").trim();
    if(!clean)return;
    const key=clean.toLowerCase();
    if(!players.has(key))players.set(key,{player_name:clean,smartest:0,supreme:0,points:0});
    const row=players.get(key);
    if(type==="smartest")row.smartest+=1;
    if(type==="supreme")row.supreme+=1;
    row.points=row.smartest+(row.supreme*4);
  };
  weekly.forEach(row=>add(row.player_name,"smartest"));
  monthly.forEach(row=>add(row.player_name,"supreme"));
  const rows=[...players.values()].sort((a,b)=>b.points-a.points||b.supreme-a.supreme||b.smartest-a.smartest||a.player_name.localeCompare(b.player_name));
  let rank=0,lastPoints=null,lastSupreme=null,lastSmartest=null;
  rows.forEach((row,index)=>{
    if(row.points!==lastPoints||row.supreme!==lastSupreme||row.smartest!==lastSmartest)rank=index+1;
    row.rank=rank;
    lastPoints=row.points;lastSupreme=row.supreme;lastSmartest=row.smartest;
  });
  return rows;
}

function renderPersonalTitleStats(data){

  return `

    </div>`;
}

/* PUSH HELPERS */

function urlBase64ToUint8Array(
  base64String
){

  const padding =
    "=".repeat(
      (
        4
        -
        base64String.length % 4
      )
      % 4
    );

  const base64 =
    (
      base64String
      +
      padding
    )
    .replace(
      /-/g,
      "+"
    )
    .replace(
      /_/g,
      "/"
    );

  const rawData =
    atob(base64);

  return Uint8Array.from(
    [...rawData]
      .map(
        char =>
          char.charCodeAt(0)
      )
  );
}


function pushSupported(){

  return (
    "serviceWorker"
    in navigator
    &&
    "PushManager"
    in window
    &&
    "Notification"
    in window
  );
}


async function getPushRegistration(){

  if(!pushSupported()){
    return null;
  }

  return await navigator
    .serviceWorker
    .register(
      "./service-worker.js"
    );
}


async function getCurrentPushSubscription(){

  const registration =
    await getPushRegistration();

  if(!registration){
    return null;
  }

  return await registration
    .pushManager
    .getSubscription();
}


async function refreshPushStatus(){

  const status =
    document.getElementById(
      "pushStatus"
    );

  const button =
    document.getElementById(
      "pushButton"
    );

  if(
    !status
    ||
    !button
  ){
    return;
  }

  if(!pushSupported()){

    status.textContent =
      "Push notifications are not supported on this device.";

    button.textContent =
      "NOT AVAILABLE";

    button.disabled =
      true;

    return;
  }

  try{

    const subscription =
      await getCurrentPushSubscription();

    if(subscription){

      status.innerHTML =
        "<strong>Status: ON</strong>";

      button.textContent =
        "DISABLE PUSH NOTIFICATIONS";

    }else{

      status.innerHTML =
        "<strong>Status: OFF</strong>";

      button.textContent =
        "ENABLE PUSH NOTIFICATIONS";
    }

    button.disabled =
      false;

  }catch(error){

    status.textContent =
      "Push status could not be checked.";

    button.textContent =
      "TRY AGAIN";

    button.disabled =
      false;
  }
}


async function togglePushNotifications(){

  const subscription =
    await getCurrentPushSubscription();

  if(subscription){
    await disablePushNotifications(
      subscription
    );

  }else{
    await enablePushNotifications();
  }

  await refreshPushStatus();
}


async function enablePushNotifications(){

  if(!pushSupported()){

    alert(
      "Push notifications are not supported on this device."
    );

    return;
  }

  let permission =
    Notification.permission;

  if(
    permission ===
    "default"
  ){

    permission =
      await Notification
        .requestPermission();
  }

  if(
    permission !==
    "granted"
  ){

    alert(
      "Push notifications were not enabled."
    );

    return;
  }

  const registration =
    await getPushRegistration();

  const keyData =
    await api(
      PUSH_SERVICE,
      {
        action:
          "public_key"
      }
    );

  if(
    !keyData.public_key
  ){

    throw new Error(
      "Push key is unavailable."
    );
  }

  let subscription =
    await registration
      .pushManager
      .getSubscription();

  if(!subscription){

    subscription =
      await registration
        .pushManager
        .subscribe({
          userVisibleOnly:true,

          applicationServerKey:
            urlBase64ToUint8Array(
              keyData.public_key
            )
        });
  }

  await api(
    PUSH_SERVICE,
    {
      action:
        "subscribe",

      subscription:
        subscription.toJSON(),

      player_id:
        playerId(),

      player_name:
        playerName()
    }
  );

  alert(
    "Push notifications are now enabled."
  );
}


async function disablePushNotifications(
  subscription
){

  if(!subscription){

    subscription =
      await getCurrentPushSubscription();
  }

  if(!subscription){
    return;
  }

  await api(
    PUSH_SERVICE,
    {
      action:
        "unsubscribe",

      endpoint:
        subscription.endpoint
    }
  );

  await subscription
    .unsubscribe();

  alert(
    "Push notifications are now disabled."
  );
}
