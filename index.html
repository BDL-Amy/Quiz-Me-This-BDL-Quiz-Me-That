<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiz Me This, BDL, Quiz Me That</title>

<style>

body{font-family:Arial;margin:0;padding:20px;background:#f3f3f3;color:#111}

main{max-width:600px;margin:auto;background:white;padding:24px;border-radius:18px}

h1{text-align:center}

small{display:block;text-align:center;color:#666;margin-bottom:25px}

button{width:100%;padding:15px;margin:7px 0;border:2px solid #111;border-radius:12px;background:white;font-size:17px;text-align:left}

.answer{background:#fff2bd;padding:15px;border-radius:12px;margin-bottom:20px}

#msg{font-weight:bold;margin-top:15px}

</style>

</head>

<body>

<main>

<h1>Quiz Me This, BDL, Quiz Me That</h1>

<small>Daily Quiz</small>

<div id="old"></div>

<div id="quiz"></div>

</main>
<script>

const questions = [
const questions = [

  {

    question: "In BDL GOSSIPER Issue 2, Baker Dip won first prize for one of his products. What did he make?",

    answers: [

      "Brown bread",

      "Apple cake",

      "Brownies",

      "American cookies"

    ],

    correct: 2

  },

  {

    question: "3 truths, 1 lie. Find the statement that is not true.",

    answers: [

      "Tofi is cute",

      "Nick doesn’t like studying",

      "Max is a bit naughty",

      "Raka is Max’s best friend"

    ],

    correct: 1

  },

  {

    question: "Max went to the river to catch a new fish for Nick. A fisherman helped him catch one. What was the fisherman’s name?",

    answers: [

      "Bob",

      "Bobby",

      "Bobo",

      "Bobu"

    ],

    correct: 0

  },

  {

    question: "Bubu is… Select the answer that is correct.",

    answers: [

      "Married to Dudu",

      "Mother of Tofi",

      "A caring person",

      "All of the above"

    ],

    correct: 3

  },

  {

    question: "When Masha, Alec, Nick and Max moved, Nick had to change schools. What was the name of the first friend he made at his new school?",

    answers: [

      "Tinki",

      "Tinka",

      "Tunka",

      "Tunki"

    ],

    correct: 0

  },

  {

    question: "In The More Than Shopping - special, one character claims not to buy a single thing. Who is that character?",

    answers: [

      "Linda",

      "Bubu",

      "Cassandra",

      "Masha"

    ],

    correct: 1

  },

  {

    question: "What is the name of Dudu’s personal assistant?",

    answers: [

      "John Johnsen",

      "Peter Peeters",

      "Robin Robinson",

      "Richard Richards"

    ],

    correct: 3
 }

];
const START_DATE = "2026-08-11";

const FIRST_QUESTION_NUMBER = 16;

function getQuizDay() {

  const now = new Date();

  // New quiz day starts at 08:00

  const todayAtEight = new Date(

    now.getFullYear(),

    now.getMonth(),

    now.getDate(),

    8, 0, 0

  );

  if (now < todayAtEight) {

    todayAtEight.setDate(todayAtEight.getDate() - 1);

  }

  const start = new Date(START_DATE + "T08:00:00");

  const difference = todayAtEight - start;

  return Math.floor(difference / 86400000);

}

function showQuestion() {

  const quiz = document.getElementById("quiz");

  const quizDay = getQuizDay();

  if (quizDay < 0) {

    quiz.innerHTML = `

      <div class="answer">

        <h2>The Daily Quiz starts on 11 August at 08:00!</h2>

      </div>

    `;

    return;

  }

  if (quizDay >= questions.length) {

    quiz.innerHTML = `

      <div class="answer">

        <h2>No new question yet.</h2>

        <p>Stay tuned!</p>

      </div>

    `;

    return;

  }

  const q = questions[quizDay];

  const questionNumber = FIRST_QUESTION_NUMBER + quizDay;

  quiz.innerHTML = `

    <h2>Question ${questionNumber}</h2>

    <p><strong>${q.question}</strong></p>

    ${q.answers.map((answer, index) => `

      <button onclick="checkAnswer(${index})">

        ${String.fromCharCode(65 + index)}. ${answer}

      </button>

    `).join("")}

    <div id="msg"></div>

  `;

}

function checkAnswer(selected) {

  const quizDay = getQuizDay();

  const q = questions[quizDay];

  const questionNumber = FIRST_QUESTION_NUMBER + quizDay;

  const msg = document.getElementById("msg");

  const selectedLetter = String.fromCharCode(65 + selected);

  msg.innerHTML = `

    <div class="answer">

      <h2>Thanks for playing today!</h2>

      <p><strong>The question was:</strong></p>

      <p>${q.question}</p>

      <p><strong>You answered:</strong></p>

      <p>${selectedLetter}. ${q.answers[selected]}</p>

      <p>

        Stay tuned! The correct answer will be revealed tomorrow

        together with a new Daily Quiz.

      </p>

    </div>

  `;

  document.querySelectorAll("#quiz button").forEach(button => {

    button.disabled = true;

  });

  localStorage.setItem(

    "bdlQuizAnswer_" + questionNumber,

    JSON.stringify({

      selected: selected,

      question: q.question

    })

  );

}

function showYesterdayResult() {

  const quizDay = getQuizDay();

  if (quizDay <= 0) {

    return;

  }

  const yesterdayIndex = quizDay - 1;

  if (yesterdayIndex >= questions.length) {

    return;

  }

  const q = questions[yesterdayIndex];

  const questionNumber =

    FIRST_QUESTION_NUMBER + yesterdayIndex;

  const saved = localStorage.getItem(

    "bdlQuizAnswer_" + questionNumber

  );

  if (!saved) {

    return;

  }

  const data = JSON.parse(saved);

  const result = document.createElement("div");

  result.className = "answer";

  result.innerHTML = `

    <h2>Yesterday's Answer</h2>

    <p><strong>The question was:</strong></p>

    <p>${q.question}</p>

    <p><strong>You answered:</strong></p>

    <p>

      ${String.fromCharCode(65 + data.selected)}.

      ${q.answers[data.selected]}

    </p>

    <p><strong>The correct answer is:</strong></p>

    <p>

      ${String.fromCharCode(65 + q.correct)}.

      ${q.answers[q.correct]}

    </p>

  `;

  const quiz = document.getElementById("quiz");

  quiz.parentNode.insertBefore(result, quiz);

}

showYesterdayResult();

showQuestion();




  



</script>
</body>
</html>
