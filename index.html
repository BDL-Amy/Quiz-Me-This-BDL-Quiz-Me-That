<!doctype html>

<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quiz Me This, BDL, Quiz Me That</title>

<style>

body{font-family:Arial;margin:0;padding:20px;background:#f3f3f3;color:#111}

main{max-width:600px;margin:auto;background:white;padding:24px;border-radius:18px}

h1{text-align:center}

small{display:block;text-align:center;color:#666;margin-bottom:25px}

button{width:100%;padding:15px;margin:7px 0;border:2px solid #111;border-radius:12px;background:white;font-size:17px;text-align:left}

.answer{background:#fff2bd;padding:15px;border-radius:12px;margin-bottom:20px}

#msg{font-weight:bold;margin-top:15px}

</style>

</head>

<body>

<main>

<h1>Quiz Me This, BDL, Quiz Me That</h1>

<small>Daily Quiz</small>

<div id="old"></div>

<div id="quiz"></div>

</main>
<script>

const questions = [

  {

    question: "In BDL GOSSIPER Issue 2, Baker Dip won first prize for one of his products. What did he make?",

    answers: [

      "Brown bread",

      "Apple cake",

      "Brownies",

      "American cookies"

    ],

    correct: 2

  },

  {

    question: "3 truths, 1 lie. Find the statement that is not true.",

    answers: [

      "Tofi is cute",

      "Nick doesn’t like studying",

      "Max is a bit naughty",

      "Raka is Max’s best friend"

    ],

    correct: 1

  },

  {

    question: "Max went to the river to catch a new fish for Nick. A fisherman helped him catch one. What was the fisherman’s name?",

    answers: [

      "Bob",

      "Bobby",

      "Bobo",

      "Bobu"

    ],

    correct: 0

  },

  {

    question: "Bubu is… Select the answer that is correct.",

    answers: [

      "Married to Dudu",

      "Mother of Tofi",

      "A caring person",

      "All of the above"

    ],

    correct: 3

  },

  {

    question: "When Masha, Alec, Nick and Max moved, Nick had to change schools. What was the name of the first friend he made at his new school?",

    answers: [

      "Tinki",

      "Tinka",

      "Tunka",

      "Tunki"

    ],

    correct: 0

  },

  {

    question: "In The More Than Shopping - special, one character claims not to buy a single thing. Who is that character?",

    answers: [

      "Linda",

      "Bubu",

      "Cassandra",

      "Masha"

    ],

    correct: 1

  },

  {

    question: "What is the name of Dudu’s personal assistant?",

    answers: [

      "John Johnsen",

      "Peter Peeters",

      "Robin Robinson",

      "Richard Richards"

    ],

    correct: 3
 }

];
const START_DATE = "2026-08-11";
const FIRST_QUESTION_NUMBER = 16;

/* ================================
   QUIZ DAY — NEW DAY AT 08:00
================================ */

function getQuizDay() {
  const now = new Date();

  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Brussels",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  }).formatToParts(now);

  const value = {};
  parts.forEach(part => {
    if (part.type !== "literal") {
      value[part.type] = part.value;
    }
  });

  let date = new Date(
    Number(value.year),
    Number(value.month) - 1,
    Number(value.day),
    Number(value.hour),
    Number(value.minute)
  );

  if (Number(value.hour) < 8) {
    date.setDate(date.getDate() - 1);
  }

  const start = new Date(2026, 7, 11);

  return Math.round(
    (
      new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      ) - start
    ) / 86400000
  );
}


/* ================================
   HELPERS
================================ */

function getQuestionNumber(index) {
  return FIRST_QUESTION_NUMBER + index;
}

function getStorageKey(index) {
  return "bdlQuizAnswer_" + getQuestionNumber(index);
}

function getSavedAnswer(index) {
  const saved = localStorage.getItem(
    getStorageKey(index)
  );

  if (saved === null) {
    return null;
  }

  try {
    const parsed = JSON.parse(saved);

    if (
      typeof parsed === "object" &&
      parsed !== null &&
      parsed.selected !== undefined
    ) {
      return Number(parsed.selected);
    }

    return Number(parsed);
  } catch {
    return Number(saved);
  }
}

function saveAnswer(index, selected) {
  localStorage.setItem(
    getStorageKey(index),
    JSON.stringify({
      selected: selected
    })
  );
}


/* ================================
   START SCREEN
================================ */

function showStartScreen() {
  const quiz = document.getElementById("quiz");
  const old = document.getElementById("old");

  old.innerHTML = "";

  const quizDay = getQuizDay();

  if (quizDay < 0) {
    quiz.innerHTML = `
      <div style="text-align:center">
        <h1>
          Quiz Me This<br>
          <span style="font-size:0.75em">BDL</span><br>
          Quiz Me That
        </h1>

        <p>
          The Daily Quiz starts on
          11 August at 08:00.
        </p>
      </div>
    `;
    return;
  }

  if (quizDay >= questions.length) {
    quiz.innerHTML = `
      <div style="text-align:center">
        <h1>
          Quiz Me This<br>
          <span style="font-size:0.75em">BDL</span><br>
          Quiz Me That
        </h1>

        <p>
          No new Daily Quiz is scheduled yet.
        </p>
      </div>
    `;
    return;
  }

  const savedAnswer = getSavedAnswer(quizDay);

  if (savedAnswer !== null) {
    quiz.innerHTML = `
      <div style="text-align:center">
        <h1>
          Quiz Me This<br>
          <span style="font-size:0.75em">BDL</span><br>
          Quiz Me That
        </h1>

        <div class="answer">
          <h2>
            You already answered today's quiz.
          </h2>

          <p>
            See you again tomorrow!
          </p>
        </div>
      </div>
    `;
    return;
  }

  quiz.innerHTML = `
    <div style="text-align:center">
      <h1>
        Quiz Me This<br>
        <span style="font-size:0.75em">BDL</span><br>
        Quiz Me That
      </h1>

      <button onclick="startQuiz()"
        style="text-align:center;font-weight:bold">
        START QUIZ
      </button>
    </div>
  `;
}


/* ================================
   START QUIZ
================================ */

function startQuiz() {
  const quizDay = getQuizDay();

  if (quizDay > 0) {
    showYesterdayPage();
  } else {
    showTodayQuestion();
  }
}


/* ================================
   YESTERDAY'S RESULT PAGE
================================ */

function showYesterdayPage() {
  const quiz = document.getElementById("quiz");
  const quizDay = getQuizDay();

  const previousIndex = quizDay - 1;

  if (
    previousIndex < 0 ||
    previousIndex >= questions.length
  ) {
    showNextStepAfterYesterday();
    return;
  }

  const q = questions[previousIndex];
  const questionNumber =
    getQuestionNumber(previousIndex);

  const selected =
    getSavedAnswer(previousIndex);

  let yourAnswer;

  if (selected === null) {
    yourAnswer = `
      <p>
        <strong>Your answer:</strong><br>
        You did not answer yesterday's question.
      </p>
    `;
  } else {
    yourAnswer = `
      <p>
        <strong>Your answer:</strong><br>
        ${String.fromCharCode(65 + selected)}.
        ${q.answers[selected]}
      </p>
    `;
  }

  let resultText = "";

  if (selected !== null) {
    if (selected === q.correct) {
      resultText = `
        <p>
          <strong>🎉 You got it right!</strong>
        </p>
      `;
    } else {
      resultText = `
        <p>
          <strong>Better luck today!</strong>
        </p>
      `;
    }
  }

  quiz.innerHTML = `
    <div class="answer">

      <h2>
        Yesterday's Question —
        Question ${questionNumber}
      </h2>

      <p>
        <strong>${q.question}</strong>
      </p>

      ${yourAnswer}

      <p>
        <strong>The correct answer:</strong><br>
        ${String.fromCharCode(65 + q.correct)}.
        ${q.answers[q.correct]}
      </p>

      ${resultText}

    </div>

    <button
      onclick="showNextStepAfterYesterday()"
      style="text-align:center;font-weight:bold">
      CONTINUE
    </button>
  `;
}


/* ================================
   AFTER YESTERDAY'S RESULT

   Monday = weekly winner screen
   Other days = today's question
================================ */

function showNextStepAfterYesterday() {
  const now = new Date();

  const weekday = new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone: "Europe/Brussels",
      weekday: "long"
    }
  ).format(now);

  if (weekday === "Monday") {
    showWeeklyWinner();
  } else {
    showTodayQuestion();
  }
}


/* ================================
   MONDAY WEEKLY WINNER SCREEN

   TEMPORARY TEST VERSION.
   Database will provide real winner later.
================================ */

function showWeeklyWinner() {
  const quiz = document.getElementById("quiz");

  quiz.innerHTML = `
    <div style="text-align:center">

      <div class="answer">

        <h2>
          🏆 Smartest BDL'er of the Week 🏆
        </h2>

        <p>
          Another week of questions,
          clever answers and a little bit
          of luck...
        </p>

        <p>
          But one BDL'er came out on top!
        </p>

        <h2>
          This week's Smartest BDL'er is...
        </h2>

        <h1>
          ⭐ TEST WINNER ⭐
        </h1>

        <p>
          <strong>Congratulations!</strong>
        </p>

        <p>
          Enjoy the glory —
          at least until next Monday. 😉
        </p>

      </div>

      <button
        onclick="showTodayQuestion()"
        style="text-align:center;font-weight:bold">
        CONTINUE TO QUESTION
      </button>

    </div>
  `;
}


/* ================================
   TODAY'S QUESTION
================================ */

function showTodayQuestion() {
  const quiz = document.getElementById("quiz");
  const quizDay = getQuizDay();

  if (
    quizDay < 0 ||
    quizDay >= questions.length
  ) {
    showStartScreen();
    return;
  }

  const q = questions[quizDay];
  const questionNumber =
    getQuestionNumber(quizDay);

  quiz.innerHTML = `
    <h2>
      Question ${questionNumber}
    </h2>

    <p>
      <strong>${q.question}</strong>
    </p>

    ${
      q.answers.map((answer, index) => `
        <button onclick="submitAnswer(${index})">
          ${String.fromCharCode(65 + index)}.
          ${answer}
        </button>
      `).join("")
    }
  `;
}


/* ================================
   SUBMIT ANSWER
================================ */

function submitAnswer(selected) {
  const quizDay = getQuizDay();

  if (
    quizDay < 0 ||
    quizDay >= questions.length
  ) {
    return;
  }

  if (getSavedAnswer(quizDay) !== null) {
    showStartScreen();
    return;
  }

  saveAnswer(quizDay, selected);

  showThankYouPage(selected);
}


/* ================================
   THANK YOU PAGE
================================ */

function showThankYouPage(selected) {
  const quiz = document.getElementById("quiz");
  const quizDay = getQuizDay();

  const q = questions[quizDay];
  const questionNumber =
    getQuestionNumber(quizDay);

  quiz.innerHTML = `
    <div class="answer">

      <h2>
        Thanks for playing today!
      </h2>

      <p>
        <strong>
          Question ${questionNumber}
        </strong>
      </p>

      <p>
        <strong>The question was:</strong><br>
        ${q.question}
      </p>

      <p>
        <strong>You answered:</strong><br>
        ${String.fromCharCode(65 + selected)}.
        ${q.answers[selected]}
      </p>

      <p>
        <strong>Stay tuned!</strong><br>
        The correct answer will be revealed
        tomorrow together with a new Daily Quiz.
      </p>

    </div>
  `;
}


/* ================================
   LOAD WEBSITE
================================ */

showStartScreen();





    
</script>
</body>
</html>
